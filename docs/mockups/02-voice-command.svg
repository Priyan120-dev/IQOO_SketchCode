<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <defs>
    <linearGradient id="bodyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="screenGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090B0E"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="420" height="840" fill="#050608"/>

  <!-- Wireframe Label Header -->
  <rect x="25" y="14" width="370" height="24" rx="4" fill="#1A202C"/>
  <text x="210" y="30" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">WIREFRAME 02 • ON-DEVICE VOICE COMMAND</text>

  <!-- Phone Body Outer -->
  <rect x="25" y="46" width="370" height="770" rx="36" fill="url(#bodyGrad2)" stroke="#2D3748" stroke-width="2.5"/>
  <!-- Screen Bezel -->
  <rect x="37" y="58" width="346" height="746" rx="28" fill="url(#screenGrad2)"/>

  <!-- Speaker & Punch Hole -->
  <circle cx="210" cy="74" r="5" fill="#000000"/>
  <rect x="180" y="62" width="60" height="4" rx="2" fill="#202530"/>

  <!-- Phone Status Bar -->
  <text x="60" y="90" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <g transform="translate(320, 80)">
    <rect x="0" y="6" width="3" height="6" fill="#CBD5E1"/>
    <rect x="5" y="4" width="3" height="8" fill="#CBD5E1"/>
    <rect x="10" y="2" width="3" height="10" fill="#CBD5E1"/>
    <rect x="15" y="0" width="3" height="12" fill="#CBD5E1"/>
    <rect x="24" y="2" width="18" height="9" rx="2" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="26" y="4" width="12" height="5" fill="#CBD5E1"/>
  </g>

  <!-- App Bar -->
  <rect x="37" y="104" width="346" height="48" fill="#121620"/>
  <text x="56" y="134" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Sketch<tspan fill="#FFB300">Code</tspan></text>
  <rect x="270" y="116" width="96" height="24" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <circle cx="282" cy="128" r="3.5" fill="#10B981"/>
  <text x="292" y="132" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">OFFLINE</text>

  <!-- Step Progress Indicator -->
  <g transform="translate(56, 166)">
    <rect x="0" y="0" width="94" height="4" rx="2" fill="#10B981"/>
    <rect x="106" y="0" width="94" height="4" rx="2" fill="#FFB300"/>
    <rect x="212" y="0" width="94" height="4" rx="2" fill="#2D3748"/>
  </g>

  <!-- Scanned Sketch Mini Card -->
  <g transform="translate(56, 186)">
    <rect x="0" y="0" width="308" height="74" rx="10" fill="#151A24" stroke="#252D3D" stroke-width="1"/>
    <!-- Thumbnail -->
    <rect x="12" y="10" width="46" height="54" rx="4" fill="#F8FAFC"/>
    <line x1="16" y1="20" x2="52" y2="20" stroke="#94A3B8" stroke-width="2"/>
    <rect x="16" y="26" width="36" height="8" rx="1" fill="none" stroke="#64748B" stroke-width="1"/>
    <rect x="16" y="38" width="18" height="6" rx="1" fill="#CBD5E1"/>
    <line x1="16" y1="50" x2="52" y2="50" stroke="#94A3B8" stroke-width="1"/>

    <text x="70" y="30" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Sketch #104 Captured</text>
    <text x="70" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">OCR: "Grocery Quick" • 4 UI bounds</text>
    <text x="70" y="62" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Ready for voice instructions</text>
  </g>

  <!-- Prompt Instruction Title -->
  <text x="210" y="295" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Describe what should happen</text>
  <text x="210" y="318" fill="#8F9CAE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Speak in Tamil (தமிழ்) or English</text>

  <!-- Live Soundwave Animation Motif -->
  <g transform="translate(90, 345)">
    <rect x="10" y="24" width="4" height="22" rx="2" fill="#FFB300"/>
    <rect x="22" y="14" width="4" height="42" rx="2" fill="#FFB300"/>
    <rect x="34" y="20" width="4" height="30" rx="2" fill="#FFB300"/>
    <rect x="46" y="8" width="4" height="54" rx="2" fill="#FFB300"/>
    <rect x="58" y="2" width="4" height="66" rx="2" fill="#FFB300"/>
    <rect x="70" y="16" width="4" height="38" rx="2" fill="#FFB300"/>
    <rect x="82" y="24" width="4" height="22" rx="2" fill="#FFB300"/>
    <rect x="94" y="6" width="4" height="58" rx="2" fill="#FFB300"/>
    <rect x="106" y="0" width="4" height="70" rx="2" fill="#FFB300"/>
    <rect x="118" y="10" width="4" height="50" rx="2" fill="#FFB300"/>
    <rect x="130" y="22" width="4" height="26" rx="2" fill="#FFB300"/>
    <rect x="142" y="4" width="4" height="62" rx="2" fill="#FFB300"/>
    <rect x="154" y="14" width="4" height="42" rx="2" fill="#FFB300"/>
    <rect x="166" y="26" width="4" height="18" rx="2" fill="#FFB300"/>
    <rect x="178" y="18" width="4" height="34" rx="2" fill="#FFB300"/>
    <rect x="190" y="12" width="4" height="46" rx="2" fill="#FFB300"/>
    <rect x="202" y="22" width="4" height="26" rx="2" fill="#FFB300"/>
    <rect x="214" y="28" width="4" height="14" rx="2" fill="#FFB300"/>
  </g>

  <!-- Real-time Speech Transcription Card -->
  <g transform="translate(56, 440)">
    <rect x="0" y="0" width="308" height="125" rx="12" fill="#131923" stroke="#253246" stroke-width="1.5"/>
    <rect x="12" y="10" width="94" height="18" rx="9" fill="#1E2838"/>
    <text x="22" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">TRANSCRIPTION</text>

    <!-- Transcribed text in Tamil-English Mix -->
    <text x="14" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      &quot;Oru grocery list app venum...&quot;
    </text>
    <text x="14" y="68" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      item type panni Add click panna list la
    </text>
    <text x="14" y="86" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      save aaganum.
    </text>

    <!-- Intent Tag -->
    <rect x="14" y="98" width="130" height="18" rx="4" fill="#1F2A3D"/>
    <text x="22" y="111" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Action: INPUT_APPEND</text>

    <rect x="150" y="98" width="120" height="18" rx="4" fill="#1F2A3D"/>
    <text x="158" y="111" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Target: itemsList</text>
  </g>

  <!-- Big Pulse Microphone Button -->
  <g transform="translate(170, 595)">
    <circle cx="40" cy="40" r="48" fill="#FFB300" fill-opacity="0.12"/>
    <circle cx="40" cy="40" r="38" fill="url(#micGrad)"/>
    <!-- Mic Icon -->
    <rect x="33" y="24" width="14" height="22" rx="7" fill="#0C1017"/>
    <path d="M 28 36 C 28 45 52 45 52 36" fill="none" stroke="#0C1017" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="46" x2="40" y2="54" stroke="#0C1017" stroke-width="3"/>
    <line x1="32" y1="54" x2="48" y2="54" stroke="#0C1017" stroke-width="3"/>
  </g>

  <!-- Tap to Stop / Engine Info -->
  <text x="210" y="718" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Listening... Tap to finish</text>
  <text x="210" y="736" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">Whisper-tiny on-device • transformers.js • 0 network bytes</text>

  <!-- Bottom Nav Indicator bar -->
  <rect x="160" y="785" width="100" height="4" rx="2" fill="#4B5563"/>
</svg>
