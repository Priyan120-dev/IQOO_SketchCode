<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <defs>
    <linearGradient id="bodyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="previewScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#131929"/>
    </linearGradient>
    <linearGradient id="amberBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="420" height="840" fill="#050608"/>

  <!-- Wireframe Label Header -->
  <rect x="25" y="14" width="370" height="24" rx="4" fill="#1A202C"/>
  <text x="210" y="30" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">WIREFRAME 03 • DETERMINISTIC LIVE PREVIEW (PWA)</text>

  <!-- Phone Body Outer -->
  <rect x="25" y="46" width="370" height="770" rx="36" fill="url(#bodyGrad3)" stroke="#2D3748" stroke-width="2.5"/>
  <!-- Screen Bezel -->
  <rect x="37" y="58" width="346" height="746" rx="28" fill="url(#previewScreen)"/>

  <!-- Speaker & Punch Hole -->
  <circle cx="210" cy="74" r="5" fill="#000000"/>
  <rect x="180" y="62" width="60" height="4" rx="2" fill="#202530"/>

  <!-- Phone Status Bar -->
  <text x="60" y="90" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <g transform="translate(320, 80)">
    <rect x="0" y="6" width="3" height="6" fill="#CBD5E1"/>
    <rect x="5" y="4" width="3" height="8" fill="#CBD5E1"/>
    <rect x="10" y="2" width="3" height="10" fill="#CBD5E1"/>
    <rect x="15" y="0" width="3" height="12" fill="#CBD5E1"/>
    <rect x="24" y="2" width="18" height="9" rx="2" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="26" y="4" width="12" height="5" fill="#CBD5E1"/>
  </g>

  <!-- Top Studio Bar with Switcher -->
  <rect x="37" y="104" width="346" height="38" fill="#0B0E14" stroke="#1F2838" stroke-width="1"/>
  <!-- Back to Editor button -->
  <path d="M 52 123 L 60 117 L 60 129 Z" fill="#CBD5E1"/>
  <text x="68" y="127" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Back</text>
  <!-- Live Mode Tag -->
  <rect x="135" y="111" width="150" height="22" rx="11" fill="#132B20" stroke="#10B981" stroke-width="1"/>
  <circle cx="147" cy="122" r="3.5" fill="#10B981"/>
  <text x="156" y="126" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">LIVE PWA PREVIEW</text>

  <!-- Office Kit sync indicator -->
  <g transform="translate(330, 112)">
    <rect x="0" y="0" width="38" height="22" rx="5" fill="#1C2433" stroke="#2D3B52" stroke-width="1"/>
    <!-- Laptop sync icon -->
    <rect x="10" y="5" width="18" height="10" rx="1" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="7" y1="16" x2="31" y2="16" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- RENDERED APP CONTAINER (The Generated User App) -->
