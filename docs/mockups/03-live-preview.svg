    </text>
    <rect x="250" y="16" width="60" height="24" rx="12" fill="#334155"/>
    <text x="264" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">3 items</text>

    <!-- Generated Input Component -->
    <text x="18" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">NEW GROCERY ITEM</text>
    <rect x="18" y="90" width="290" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="32" y="116" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">e.g., Cooking Oil 1L</text>

