    <text x="163" y="167" fill="#0C1017" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">+ Add to List</text>

    <!-- Generated List Section -->
    <text x="18" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CURRENT LIST</text>

    <!-- List Item 1 -->
    <g transform="translate(18, 222)">
      <rect x="0" y="0" width="290" height="48" rx="8" fill="#1E293B"/>
      <!-- Checkbox circle -->
      <circle cx="22" cy="24" r="10" fill="#10B981"/>
      <path d="M 17 24 L 20 27 L 27 20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Fresh Milk (Aavin 500ml)</text>
      <text x="44" y="38" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Dairy • 1 packet</text>
      <!-- Delete icon -->
      <line x1="262" y1="18" x2="274" y2="30" stroke="#64748B" stroke-width="1.5"/>
      <line x1="274" y1="18" x2="262" y2="30" stroke="#64748B" stroke-width="1.5"/>
    </g>

    <!-- List Item 2 -->
    <g transform="translate(18, 278)">
      <rect x="0" y="0" width="290" height="48" rx="8" fill="#1E293B"/>
      <circle cx="22" cy="24" r="10" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="44" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Brown Eggs (6 pcs)</text>
      <text x="44" y="38" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Poultry • Tray</text>
      <line x1="262" y1="18" x2="274" y2="30" stroke="#64748B" stroke-width="1.5"/>
      <line x1="274" y1="18" x2="262" y2="30" stroke="#64748B" stroke-width="1.5"/>
    </g>

    <!-- List Item 3 -->
    <g transform="translate(18, 334)">
      <rect x="0" y="0" width="290" height="48" rx="8" fill="#1E293B"/>
      <circle cx="22" cy="24" r="10" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="44" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Bananas (1 kg)</text>
      <text x="44" y="38" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Fruits • Produce</text>
      <line x1="262" y1="18" x2="274" y2="30" stroke="#64748B" stroke-width="1.5"/>
      <line x1="274" y1="18" x2="262" y2="30" stroke="#64748B" stroke-width="1.5"/>
    </g>

    <!-- Generated Bottom Tab Navigation Bar -->
    <g transform="translate(0, 436)">
      <rect x="0" y="0" width="326" height="54" rx="0" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <text x="54" y="28" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Items</text>
      <circle cx="54" cy="38" r="2" fill="#FFB300"/>

      <text x="163" y="28" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Cart</text>
      <text x="272" y="28" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Summary</text>
    </g>
  </g>

  <!-- Bottom Drawer / Studio Controls -->
  <g transform="translate(47, 650)">
    <rect x="0" y="0" width="326" height="124" rx="14" fill="#131924" stroke="#253246" stroke-width="1"/>

    <!-- Spec Status Bar -->
    <circle cx="16" cy="18" r="4" fill="#10B981"/>
    <text x="28" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Spec Valid: 1 Screen, 6 Components</text>
    <text x="250" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">0 syntax err</text>

    <!-- Action Buttons -->
    <!-- Voice Refine Button -->
    <rect x="12" y="38" width="144" height="34" rx="8" fill="#1E2838" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="55" r="5" fill="#FFB300"/>
    <text x="40" y="59" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Refine by Voice</text>

    <!-- Export / Office Kit Button -->
    <rect x="168" y="38" width="146" height="34" rx="8" fill="#2563EB"/>
    <text x="190" y="59" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Sync Office Kit</text>

    <!-- Info note -->
    <text x="163" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">
      PWA running deterministically on iQOO device
    </text>
