<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090B0E"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="420" height="840" fill="#050608"/>

  <!-- Wireframe Label Header -->
  <rect x="25" y="14" width="370" height="24" rx="4" fill="#1A202C"/>
  <text x="210" y="30" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">WIREFRAME 01 • CAMERA CAPTURE &amp; SHAPE DETECTION</text>

  <!-- Phone Body Outer -->
  <rect x="25" y="46" width="370" height="770" rx="36" fill="url(#bodyGrad)" stroke="#2D3748" stroke-width="2.5"/>
  <!-- Screen Bezel -->
  <rect x="37" y="58" width="346" height="746" rx="28" fill="url(#screenGrad)"/>

  <!-- Camera Punch Hole / Speaker -->
  <circle cx="210" cy="74" r="5" fill="#000000"/>
  <rect x="180" y="62" width="60" height="4" rx="2" fill="#202530"/>

  <!-- Phone Status Bar -->
  <text x="60" y="90" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <g transform="translate(320, 80)">
    <!-- Cellular -->
    <rect x="0" y="6" width="3" height="6" fill="#CBD5E1"/>
    <rect x="5" y="4" width="3" height="8" fill="#CBD5E1"/>
    <rect x="10" y="2" width="3" height="10" fill="#CBD5E1"/>
    <rect x="15" y="0" width="3" height="12" fill="#CBD5E1"/>
    <!-- Battery -->
    <rect x="24" y="2" width="18" height="9" rx="2" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="26" y="4" width="12" height="5" fill="#CBD5E1"/>
  </g>

  <!-- App Bar inside Phone -->
  <rect x="37" y="104" width="346" height="48" fill="#121620"/>
  <text x="56" y="134" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Sketch<tspan fill="#FFB300">Code</tspan></text>
  <rect x="270" y="116" width="96" height="24" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <circle cx="282" cy="128" r="3.5" fill="#10B981"/>
  <text x="292" y="132" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">OFFLINE</text>

  <!-- Camera Viewfinder Area -->
  <g transform="translate(49, 160)">
    <!-- Viewfinder Background (representing camera feed of desk/paper) -->
    <rect x="0" y="0" width="322" height="490" rx="14" fill="#1E2430" stroke="#334155" stroke-width="1.5"/>

    <!-- Paper Sheet in View -->
    <g transform="translate(24, 25)">
      <rect x="0" y="0" width="274" height="438" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Simulated Paper Grid Lines -->
      <line x1="16" y1="36" x2="258" y2="36" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="16" y1="72" x2="258" y2="72" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="16" y1="108" x2="258" y2="108" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="16" y1="144" x2="258" y2="144" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Hand-drawn Title -->
      <text x="24" y="28" fill="#334155" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold">Grocery Quick</text>

      <!-- Hand-drawn Input Box -->
      <rect x="20" y="48" width="234" height="38" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
      <text x="32" y="72" fill="#64748B" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13">[ item name... ]</text>

      <!-- Hand-drawn Button -->
      <rect x="20" y="100" width="105" height="36" rx="4" fill="#E2E8F0" stroke="#334155" stroke-width="2"/>
      <text x="36" y="124" fill="#1E293B" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13">+ Add</text>

      <!-- Hand-drawn List items -->
      <rect x="20" y="152" width="234" height="38" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="34" y="176" fill="#334155" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13">1. Milk (Aavin 500ml)</text>

      <rect x="20" y="200" width="234" height="38" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="34" y="224" fill="#334155" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13">2. Brown Eggs (6 pcs)</text>

      <rect x="20" y="248" width="234" height="38" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="34" y="272" fill="#334155" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13">3. Bananas (1 kg)</text>

      <!-- Bottom Tab Bar Sketch -->
      <rect x="20" y="370" width="234" height="42" rx="3" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
      <text x="50" y="396" fill="#475569" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12">Items</text>
      <text x="130" y="396" fill="#94A3B8" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12">Cart</text>
      <text x="200" y="396" fill="#94A3B8" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12">Bill</text>
    </g>

    <!-- Real-time Computer Vision Bounding Boxes (Tesseract / Shape Detection) -->
    <!-- Bounding Box 1: Input -->
    <rect x="40" y="69" width="242" height="46" rx="4" fill="none" stroke="#FFB300" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="42" y="55" width="82" height="15" rx="3" fill="#FFB300"/>
    <text x="46" y="66" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">INPUT_FIELD</text>

    <!-- Bounding Box 2: Button -->
    <rect x="40" y="121" width="113" height="44" rx="4" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="42" y="107" width="56" height="15" rx="3" fill="#38BDF8"/>
    <text x="46" y="118" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">BUTTON</text>

    <!-- Bounding Box 3: List Container -->
    <rect x="40" y="173" width="242" height="148" rx="4" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="42" y="159" width="52" height="15" rx="3" fill="#34D399"/>
    <text x="46" y="170" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">LIST_VIEW</text>

    <!-- Viewfinder Corner Guides -->
    <path d="M 8 24 L 8 8 L 24 8" fill="none" stroke="#FFB300" stroke-width="3"/>
    <path d="M 314 24 L 314 8 L 298 8" fill="none" stroke="#FFB300" stroke-width="3"/>
    <path d="M 8 466 L 8 482 L 24 482" fill="none" stroke="#FFB300" stroke-width="3"/>
    <path d="M 314 466 L 314 482 L 298 482" fill="none" stroke="#FFB300" stroke-width="3"/>
  </g>

  <!-- Bottom Control Deck -->
  <g transform="translate(49, 665)">
    <!-- Detection Pill -->
    <rect x="16" y="0" width="290" height="28" rx="14" fill="#171F2C" stroke="#2C394F" stroke-width="1"/>
    <circle cx="30" cy="14" r="4" fill="#FFB300"/>
    <text x="42" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      Layout locked: 1 Input, 1 Button, 1 List
    </text>

    <!-- Capture Button -->
    <g transform="translate(126, 42)">
      <circle cx="35" cy="35" r="34" fill="none" stroke="#FFB300" stroke-width="3"/>
      <circle cx="35" cy="35" r="28" fill="#FFFFFF"/>
    </g>

    <!-- Flash / Flip icons placeholder -->
    <circle cx="45" cy="77" r="18" fill="#1C2433"/>
    <path d="M 45 68 L 41 78 L 47 78 L 43 86" fill="none" stroke="#CBD5E1" stroke-width="2"/>

    <circle cx="275" cy="77" r="18" fill="#1C2433"/>
    <path d="M 268 77 A 7 7 0 1 1 282 77" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  </g>
</svg>
