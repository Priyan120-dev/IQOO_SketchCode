<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#181e2b"/>
    </linearGradient>

    <!-- Accent Yellow Gradient (iQOO Style) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2230" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#11151f" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#dotGrid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="150" r="160" fill="#FF9100" fill-opacity="0.06" filter="url(#glow)"/>
  <circle cx="1020" cy="140" r="140" fill="#00E5FF" fill-opacity="0.04" filter="url(#glow)"/>

  <!-- Left / Center Content -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="42" width="240" height="26" rx="13" fill="#FFB300" fill-opacity="0.12" stroke="#FFB300" stroke-width="1"/>
    <circle cx="14" cy="55" r="4" fill="#FFB300"/>
    <text x="26" y="59" fill="#FFD000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DEVELOPER TOOLS TRACK</text>

    <!-- Project Title -->
    <text x="0" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      Sketch<tspan fill="url(#amberGrad)">Code</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="165" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" letter-spacing="0.5">
      Sketch it. Say it. Run it.
    </text>

    <!-- Subtitle / Pitch -->
    <text x="2" y="202" fill="#8F9CAE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Turn hand-drawn paper sketches + voice commands into working on-device app previews.
    </text>

    <!-- Capability Tags -->
    <g transform="translate(2, 230)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#171D28" stroke="#2B3548" stroke-width="1"/>
      <text x="12" y="16" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">100% OFFLINE</text>

      <rect x="140" y="0" width="145" height="24" rx="6" fill="#171D28" stroke="#2B3548" stroke-width="1"/>
      <text x="152" y="16" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ON-DEVICE AI</text>

      <rect x="295" y="0" width="155" height="24" rx="6" fill="#171D28" stroke="#2B3548" stroke-width="1"/>
      <text x="307" y="16" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TAMIL + ENGLISH</text>

      <rect x="460" y="0" width="150" height="24" rx="6" fill="#171D28" stroke="#2B3548" stroke-width="1"/>
      <text x="472" y="16" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">iQOO OFFICE KIT</text>
    </g>
  </g>

  <!-- Right Visual Motif (Phone + Paper Sketch + Stylus) -->
  <g transform="translate(860, 30)">
    <!-- Phone Outer Body -->
    <rect x="70" y="10" width="140" height="230" rx="20" fill="url(#cardGrad)" stroke="#384357" stroke-width="2.5"/>
    <!-- Screen Bezel -->
    <rect x="78" y="22" width="124" height="206" rx="14" fill="#0C1017"/>
    <!-- Phone Camera Notch / Pill -->
    <rect x="120" y="27" width="40" height="6" rx="3" fill="#1F2836"/>

    <!-- Screen UI Elements (Simulated live preview) -->
    <!-- App Header -->
    <rect x="88" y="44" width="104" height="20" rx="4" fill="#1E2738"/>
    <circle cx="98" cy="54" r="4" fill="#FFB300"/>
    <rect x="108" y="51" width="50" height="6" rx="2" fill="#E2E8F0"/>
    <!-- App Search / Input -->
    <rect x="88" y="70" width="104" height="14" rx="3" fill="#151C28" stroke="#2C384E" stroke-width="1"/>
    <rect x="94" y="74" width="40" height="5" rx="1.5" fill="#4B5A72"/>
    <!-- App Card 1 -->
    <rect x="88" y="90" width="104" height="32" rx="4" fill="#171E2D"/>
    <circle cx="100" cy="106" r="6" fill="#243046"/>
    <rect x="112" y="99" width="55" height="5" rx="1.5" fill="#CBD5E1"/>
    <rect x="112" y="108" width="35" height="4" rx="1" fill="#64748B"/>
    <rect x="172" y="101" width="14" height="10" rx="2" fill="#FFB300" fill-opacity="0.3"/>
    <!-- App Card 2 -->
    <rect x="88" y="128" width="104" height="32" rx="4" fill="#171E2D"/>
    <circle cx="100" cy="144" r="6" fill="#243046"/>
    <rect x="112" y="137" width="50" height="5" rx="1.5" fill="#CBD5E1"/>
    <rect x="112" y="146" width="40" height="4" rx="1" fill="#64748B"/>
    <!-- Primary CTA Button -->
    <rect x="88" y="168" width="104" height="20" rx="5" fill="url(#amberGrad)"/>
    <rect x="120" y="175" width="40" height="6" rx="2" fill="#0C1017"/>

    <!-- Bottom Navigation Bar -->
    <rect x="88" y="196" width="104" height="18" rx="3" fill="#121722"/>
    <circle cx="104" cy="205" r="3" fill="#FFB300"/>
    <circle cx="140" cy="205" r="3" fill="#4A5568"/>
    <circle cx="176" cy="205" r="3" fill="#4A5568"/>

    <!-- Physical Paper Sketch (Overlapping left of phone) -->
    <g transform="translate(10, 60) rotate(-10)">
      <!-- Paper Sheet -->
      <rect x="0" y="0" width="95" height="135" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- Sketch Notebook Header -->
      <line x1="12" y1="18" x2="83" y2="18" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2"/>
      <!-- Hand-drawn style boxes -->
      <rect x="12" y="26" width="71" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="1.5"/>
      <line x1="16" y1="33" x2="45" y2="33" stroke="#64748B" stroke-width="1.5"/>
      <!-- Button Sketch -->
      <rect x="12" y="46" width="71" height="16" rx="3" fill="#CBD5E1" fill-opacity="0.4" stroke="#475569" stroke-width="1.5"/>
      <line x1="30" y1="54" x2="65" y2="54" stroke="#334155" stroke-width="2"/>
      <!-- List Items Sketch -->
      <rect x="12" y="70" width="71" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1"/>
      <line x1="18" y1="79" x2="60" y2="79" stroke="#64748B" stroke-width="1.5"/>
      <rect x="12" y="93" width="71" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1"/>
      <line x1="18" y1="102" x2="52" y2="102" stroke="#64748B" stroke-width="1.5"/>
      <!-- Dog-ear fold top-right -->
      <path d="M 83 0 L 95 12 L 83 12 Z" fill="#CBD5E1"/>
    </g>

    <!-- Stylus / Pencil Motif -->
    <g transform="translate(42, 160) rotate(32)">
      <polygon points="0,0 12,0 6,18" fill="#FFB300"/>
      <polygon points="4,12 8,12 6,18" fill="#0C1017"/>
      <rect x="0" y="-70" width="12" height="70" rx="1" fill="#3B82F6"/>
      <rect x="0" y="-76" width="12" height="6" fill="#CBD5E1"/>
    </g>

    <!-- Acoustic / Voice Soundwave Accents -->
    <g transform="translate(195, 80)">
      <line x1="28" y1="20" x2="28" y2="36" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="36" y1="12" x2="36" y2="44" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="44" y1="16" x2="44" y2="40" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="52" y1="23" x2="52" y2="33" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
